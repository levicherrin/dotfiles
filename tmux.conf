# Enable mouse mode (scrolling with mouse wheel, selecting panes, resizing)
set -g mouse on

# Increase scrollback history buffer limit
set -g history-limit 50000

# Use vi keybindings in copy/scroll mode
setw -g mode-keys vi

# Enable 24-bit true color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
